<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Checker</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; margin-bottom: 15px; outline: none; }
        input:focus { border-color: #007bff; }
        .status { font-size: 18px; font-weight: bold; color: #666; }
    </style>
</head>
<body>

<div class="card">
    <h2>Password Checker</h2>
    <input type="password" id="password" placeholder="Type your password...">
    <div id="status" class="status">View password strong or weak</div> 
</div>

<script>
    const passwordInput = document.getElementById('password');
    const statusText = document.getElementById('status');

    passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;

        if (!val) {
            statusText.textContent = 'Enter a password';
            statusText.style.color = '#666';
            return;
        }

        // Requirements: 8+ chars, mix of letters, numbers, and special symbols
        const isStrong = val.length >= 8 && 
                         /[A-Za-z]/.test(val) && 
                         /\d/.test(val) && 
                         /[^A-Za-z0-9]/.test(val);

        if (isStrong) {
            statusText.textContent = 'Strong ✅';
            statusText.style.color = '#2ec4b6'; 
        } else {
            statusText.textContent = 'Weak ❌';
            statusText.style.color = '#ff4d4d'; 
        }
    });
</script>

</body>
</html>
