<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        input { width: 100%; padding: 12px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #007bff; outline: none; }
        .meter { height: 6px; background-color: #e0e0e0; border-radius: 3px; margin-top: 15px; overflow: hidden; }
        .bar { height: 100%; width: 0%; transition: width 0.4s ease, background-color 0.4s ease; }
        .text { margin-top: 8px; font-size: 14px; font-weight: bold; text-align: right; color: #666; }
    </style>
</head>
<body>

<div class="card">
    <h2>Password Checker</h2>
    <input type="password" id="password" placeholder="Type your password...">
    <div class="meter"><div id="bar" class="bar"></div></div>
    <div id="text" class="text">Enter a password</div>
</div>

<script>
    const passwordInput = document.getElementById('password');
    const bar = document.getElementById('bar');
    const text = document.getElementById('text');

    passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        let score = 0;

        if (!val) {
            bar.style.width = '0%';
            text.textContent = 'Enter a password';
            text.style.color = '#666';
            return;
        }

        // Strength Rules
        if (val.length >= 8) score++;
        if (/[a-z]/.test(val)) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/\d/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        // UI Mapping
        let width = '0%', status = '', color = '';
        switch(score) {
            case 1:
            case 2:
                width = '33%'; status = 'Weak ❌'; color = '#ff4d4d';
                break;
            case 3:
            case 4:
                width = '66%'; status = 'Medium ⚠️'; color = '#ffa500';
                break;
            case 5:
                width = '100%'; status = 'Strong 💪'; color = '#2ec4b6';
                break;
        }

        bar.style.width = width;
        bar.style.backgroundColor = color;
        text.textContent = status;
        text.style.color = color;
    });
</script>

</body>
</html>
